<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쉼표 - 선생님용</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="teacher">
  <header class="top t">
    <h1>쉼표<span>,</span> <small>선생님용</small></h1>
    <a href="index.html" class="back">학생 화면 보기</a>
  </header>

  <main class="wide">
    <section class="box narrow" id="login">
      <h2>선생님 확인</h2>
      <input type="password" id="pin" placeholder="PIN" maxlength="10">
      <button class="btn" id="btnLogin">들어가기</button>
    </section>

    <section id="dash" hidden>
      <div class="toolbar">
        <select id="clsSel"></select>
        <button class="btn small" id="btnRefresh">새로고침</button>
        <span class="grow"></span>
        <button class="btn line small" id="btnSeed">시연용 데이터 넣기</button>
        <button class="btn line small" id="btnClear">전부 지우기</button>
      </div>

      <div class="cols">
        <div class="box">
          <h2>이번 주 마음 날씨</h2>
          <p class="hint">누가 눌렀는지는 안 나와요. 반 전체 분위기만 봅니다.</p>
          <div id="moodStats"></div>
        </div>

        <div class="box">
          <h2>도움 요청 <span class="badge" id="newCount"></span></h2>
          <div class="filters" id="filters">
            <button data-f="all" class="on">전체</button>
            <button data-f="new">새로 온 것</button>
            <button data-f="replied">답장함</button>
            <button data-f="done">마무리</button>
          </div>
          <div id="reqList"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>
